<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Is This A Scam?</title>
<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --line:#232a33; --txt:#e6edf3; --dim:#a8b2bd;
    --safe:#2ea043; --likely:#3fb950; --caution:#d29922; --risky:#f0883e; --danger:#f85149;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:28px 20px calc(28px + env(safe-area-inset-bottom));min-height:100vh;
    overflow-x:hidden;
  }
  .wrap{width:100%;max-width:640px}

  header{text-align:center;margin-bottom:26px}
  h1{font-size:27px;font-weight:700;letter-spacing:-.4px}
  h1 span{color:var(--dim);font-weight:400}
  .sub{color:var(--dim);font-size:13.5px;margin-top:7px}

  .search{display:flex;gap:10px;margin-bottom:8px}
  input[type=text]{
    flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);
    color:var(--txt);border-radius:11px;padding:15px 16px;font-size:16px;outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  input[type=text]::placeholder{color:#5b6470}
  input[type=text]:focus{border-color:#3d8bfd;box-shadow:0 0 0 3px rgba(61,139,253,.16)}
  button{
    background:#2f81f7;color:#fff;border:0;border-radius:11px;
    padding:15px 24px;font-size:16px;font-weight:600;cursor:pointer;
    transition:background .15s,transform .06s;white-space:nowrap;
  }
  button:hover:not(:disabled){background:#4b93f8}
  button:active:not(:disabled){transform:scale(.985)}
  button:disabled{opacity:.55;cursor:default}
  .hint{color:var(--dim);font-size:12.5px;text-align:center;min-height:17px}

  /* ---- result ---- */
  #result{margin-top:26px;display:none}
  #result.on{display:block;animation:rise .28s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:24px}
  .top{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
  .ring{position:relative;width:132px;height:132px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:10;stroke-linecap:round}
  .ring .track{stroke:#232a33}
  .ring .bar{transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1),stroke .3s}
  .ring .num{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
  }
  .ring .num b{font-size:36px;font-weight:700;line-height:1;letter-spacing:-1px}
  .ring .num i{font-size:11px;color:var(--dim);font-style:normal;margin-top:3px}

  .meta{flex:1;min-width:210px}
  .verdict{font-size:23px;font-weight:700;line-height:1.2}
  .domain{color:var(--dim);font-size:13.5px;margin-top:5px;word-break:break-all}
  .summary{font-size:14.5px;color:#d3dae1;margin-top:14px;line-height:1.6}

  .sources{margin-top:20px;border-top:1px solid var(--line);padding-top:6px}
  .src{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #1b212a}
  .src:last-child{border-bottom:0}
  .src .nm{font-size:13.5px;font-weight:600;width:150px;flex:none}
  .src .dt{font-size:13px;color:#b6c0cb;flex:1;min-width:0;word-break:break-word;line-height:1.45}
  .src .sc{font-size:13px;font-weight:700;flex:none;font-variant-numeric:tabular-nums}
  .src.off .nm,.src.off .dt{opacity:.42}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}

  .foot{display:flex;justify-content:space-between;gap:10px;margin-top:14px;
        color:var(--dim);font-size:11.5px;flex-wrap:wrap}
  .why{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
       color:#7d8794;font-size:11.5px;line-height:1.55;word-break:break-word}
  .err{background:#2d1517;border:1px solid #f8514933;color:#ffb4ae;
       border-radius:11px;padding:14px 16px;margin-top:22px;font-size:14px;display:none}
  .err.on{display:block}

  .spin{width:15px;height:15px;border:2px solid #ffffff44;border-top-color:#fff;
        border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:8px;
        animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media (max-width:520px){
    body{padding:20px 15px calc(20px + env(safe-area-inset-bottom))}
    h1{font-size:23px}
    .search{flex-direction:column}
    button{width:100%}
    .src .nm{width:118px;font-size:12.5px}
    .top{gap:16px}
    .ring{width:112px;height:112px}
    .ring .num b{font-size:31px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Is This A Scam? <span>·</span></h1>
    <div class="sub">Paste a link. Get a score out of 100.</div>
  </header>

  <form class="search" id="form" autocomplete="off">
    <input type="text" id="q" placeholder="example.com or https://…" spellcheck="false"
           autocapitalize="off" autocorrect="off">
    <button type="submit" id="go">Check</button>
  </form>
  <div class="hint" id="hint"></div>

  <div class="err" id="err"></div>

  <div id="result">
    <div class="card">
      <div class="top">
        <div class="ring">
          <svg width="132" height="132" viewBox="0 0 132 132">
            <circle class="track" cx="66" cy="66" r="58"></circle>
            <circle class="bar" id="bar" cx="66" cy="66" r="58"
                    stroke-dasharray="364.4" stroke-dashoffset="364.4"></circle>
          </svg>
          <div class="num"><b id="score">–</b><i>/ 100</i></div>
        </div>
        <div class="meta">
          <div class="verdict" id="verdict"></div>
          <div class="domain" id="domain"></div>
          <div class="summary" id="summary"></div>
        </div>
      </div>
      <div class="sources" id="sources"></div>
      <div class="why" id="why"></div>
    </div>
    <div class="foot">
      <span id="timing"></span>
      <span id="stamp"></span>
    </div>
  </div>
</div>

<script src="core.js"></script>
<script src="ui.js"></script>
</body>
</html>
